name: Deploy to GitHub Pages

on:
  push:
    branches:
      - claude/compassionate-pascal-6koix4
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 同一时间只允许一个部署，取消进行中的旧部署
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        # enablement: true 会在 Pages 未开启时通过 API 自动开启
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload artifact
        # 上传整个仓库根目录作为静态站点
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
